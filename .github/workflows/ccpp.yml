name: Integration checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate locales, JavaScript and JSON buffer handling
        env:
          VTOY_SANITIZE: '1'
        run: python3 tests/integration/check.py
      - name: Run Ventoy's native JSON validator
        run: sh LANGUAGES/check.sh "$PWD"
